<!-- Order: list, total and the WhatsApp form -->
<div class="cart-bar" id="cartBar" hidden>
  <div class="cart-bar-inner">
    <span class="cart-bar-info"><strong id="cartCount"></strong><span id="cartTotal"></span></span>
    <button class="btn btn--primary btn--sm" type="button" id="cartOpen"><span data-ar="مراجعة الطلب وإرساله" data-en="Review &amp; send order">مراجعة الطلب وإرساله</span></button>
  </div>
</div>

<dialog class="order-dialog" id="orderDialog" aria-labelledby="orderTitle">
  <div class="order-sheet">
    <div class="order-head">
      <h2 id="orderTitle"></h2>
      <button class="icon-btn order-close" type="button" id="orderClose" aria-label="إغلاق" data-label-ar="إغلاق" data-label-en="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <ul class="order-lines" id="orderLines"></ul>
    <div class="order-total" id="orderTotal"></div>
    <form class="form order-form" id="orderForm" novalidate>
      <label class="field">
        <span class="field-label" data-ar="الاسم" data-en="Name">الاسم</span>
        <input type="text" name="name" autocomplete="name" required minlength="2" placeholder="اكتب اسمك" data-placeholder-ar="اكتب اسمك" data-placeholder-en="Your name">
      </label>
      <div class="form-row">
        <label class="field">
          <span class="field-label" data-ar="رقم الواتساب" data-en="WhatsApp number">رقم الواتساب</span>
          <input type="tel" name="whatsapp" autocomplete="tel" inputmode="tel" required placeholder="+970 59 000 0000" data-placeholder-ar="+970 59 000 0000" data-placeholder-en="+970 59 000 0000">
        </label>
        <label class="field">
          <span class="field-label" data-ar="البريد الإلكتروني" data-en="Email">البريد الإلكتروني</span>
          <input type="email" name="email" autocomplete="email" required placeholder="name@example.com" data-placeholder-ar="name@example.com" data-placeholder-en="name@example.com">
        </label>
      </div>
      <label class="field">
        <span class="field-label"><span data-ar="ملاحظات" data-en="Notes">ملاحظات</span> <span class="optional" data-ar="(اختياري)" data-en="(optional)">(اختياري)</span></span>
        <textarea name="note" rows="2" placeholder="مثلاً: نوع نشاطك أو موعد التسليم المطلوب" data-placeholder-ar="مثلاً: نوع نشاطك أو موعد التسليم المطلوب" data-placeholder-en="e.g. your type of business or the delivery date you need"></textarea>
      </label>
      <label class="hp-field" aria-hidden="true">Website <input type="text" id="orderWebsite" tabindex="-1" autocomplete="off"></label>
      <button class="btn btn--primary btn--block" type="submit"><span data-ar="أرسل الطلب عبر واتساب" data-en="Send the order on WhatsApp">أرسل الطلب عبر واتساب</span><svg class="icon-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <p class="form-status" id="orderStatus" role="status" aria-live="polite" hidden></p>
      <p class="form-note" data-ar="ستُفتح رسالتك جاهزة في واتساب، وما عليك إلا الضغط على «إرسال». نتفق معك على التفاصيل والسعر النهائي هناك." data-en="Your message opens ready in WhatsApp; just press Send. We agree on the details and final price there.">ستُفتح رسالتك جاهزة في واتساب، وما عليك إلا الضغط على «إرسال». نتفق معك على التفاصيل والسعر النهائي هناك.</p>
    </form>
  </div>
</dialog>
